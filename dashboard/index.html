<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelinq Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Login screen -->
  <div id="login-screen">
    <h1>Shelinq</h1>
    <div class="password-wrapper">
      <input type="password" id="password-input" placeholder="Enter password" />
      <button type="button" id="toggle-password" class="toggle-password-btn">
        <svg id="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <button id="login-btn">Log In</button>
    <p id="login-error" class="error"></p>
  </div>

  <!-- Main dashboard (hidden until logged in) -->
  <div id="dashboard-screen" class="hidden">
    <div class="brand-header">
      <h2>Shelinq</h2>
    </div>

    <div class="header-row">
      <h1>Your Books</h1>
      <button class="secondary" id="logout-btn">Log Out</button>
    </div>

    <div id="upload-section">
      <input type="text" id="title-input" placeholder="Book title" />
      <input type="file" id="file-input" accept="application/pdf" />
      <button id="upload-btn">Upload Book</button>
      <p id="upload-status"></p>
    </div>

    <div class="table-wrapper">
      <table id="books-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Added</th>
            <th>QR Code</th>
            <th>Link</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="books-list"></tbody>
      </table>
    </div>
  </div>

  <!-- Edit modal -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Edit Book</h2>
      <label>Title</label>
      <input type="text" id="edit-title-input" placeholder="Book title" />
      <label>Replace PDF (optional)</label>
      <input type="file" id="edit-file-input" accept="application/pdf" />
      <div class="modal-actions">
        <button class="secondary" id="edit-cancel-btn">Cancel</button>
        <button id="edit-save-btn">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Confirm modal (used for delete) -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="confirm-title">Are you sure?</h2>
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button class="secondary" id="confirm-cancel-btn">Cancel</button>
        <button class="danger-solid" id="confirm-ok-btn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
